[pytest]
# testpaths is a safety fence, not tidiness. `pytest` with no arguments used to
# collect backend/test_momentum.py, which opens SessionLocal() at import time —
# i.e. running the test suite connected to the production database. That file
# is now scripts/inspect_momentum.py, and collection is pinned to tests/ so a
# future stray test_*.py outside it cannot repeat the trick.
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # SQLite has no native DECIMAL, so SQLAlchemy warns that it is emulating it.
    # The emulation rebuilds each value at the column's declared scale, which is
    # exact for 2-dp rupee amounts; production is Postgres, which stores NUMERIC
    # natively. Everything else is an error, so a real warning cannot hide here.
    error
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:UserWarning
